[package]
name = "cnctd_mta"
version = "0.2.0"
edition = "2021"
authors = ["Connected Dot Inc.", "Kyle Ebner <kyle@cnctd.world>"]
description = "NYC MTA subway realtime data: arrivals, alerts, and vehicle positions"
repository = "https://github.com/Connected-Dot/cnctd_mta"
license = "MIT"
keywords = ["mta", "subway", "gtfs", "transit"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
gtfs-realtime = "0.2"
prost = "0.14"
reqwest = { version = "0.12", features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
